services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: aep_local_only
      POSTGRES_DB: aep
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aep -d aep"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: ["python", "-m", "aep", "migrate"]
    environment: &runtime
      DATABASE_URL: postgresql://aep:aep_local_only@postgres:5432/aep
      ARTIFACT_ROOT: /artifacts
      AEP_API_KEY: ${AEP_API_KEY:-local-development-only}
      AEP_LEASE_SECONDS: ${AEP_LEASE_SECONDS:-15}
      AEP_POLL_SECONDS: ${AEP_POLL_SECONDS:-1}
      AEP_FAKE_DELAY_SECONDS: ${AEP_FAKE_DELAY_SECONDS:-0}
      AEP_RUN_CONCURRENCY_LIMIT: ${AEP_RUN_CONCURRENCY_LIMIT:-4}
      AEP_INLINE_RECONCILIATION: "false"
      AEP_ENABLE_OPENAI: ${AEP_ENABLE_OPENAI:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AEP_OPENAI_MODEL: ${AEP_OPENAI_MODEL:-}
      AEP_MODEL_PRICE_VERSION: ${AEP_MODEL_PRICE_VERSION:-}
      AEP_MODEL_INPUT_RATE: ${AEP_MODEL_INPUT_RATE:-0}
      AEP_MODEL_CACHED_INPUT_RATE: ${AEP_MODEL_CACHED_INPUT_RATE:-}
      AEP_MODEL_OUTPUT_RATE: ${AEP_MODEL_OUTPUT_RATE:-0}
      AEP_MODEL_HTTP_TIMEOUT: ${AEP_MODEL_HTTP_TIMEOUT:-30}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment: *runtime
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["python", "-m", "aep", "worker"]
    environment:
      <<: *runtime
      AEP_WORKER_MAINTENANCE: "false"
    volumes:
      - artifacts:/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      scheduler:
        condition: service_started
      reconciler:
        condition: service_started
    restart: unless-stopped
  scheduler:
    build: .
    command: ["python", "-m", "aep", "scheduler"]
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  reconciler:
    build: .
    command: ["python", "-m", "aep", "reconciler"]
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
  artifacts:
