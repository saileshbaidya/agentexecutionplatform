name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: aep_ci_only
          POSTGRES_DB: aep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep -d aep"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://aep:aep_ci_only@localhost:5432/aep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
